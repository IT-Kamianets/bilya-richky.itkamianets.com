<article class="room-card">
	<div class="room-card__media">
		<img [src]="product.image" [alt]="product.title" />
		<span class="room-card__badge" *ngIf="product.isNew">New</span>
	</div>
	<div class="room-card__body">
		<div class="room-card__meta">
			<span class="room-card__category">{{ product.category }}</span>
			<span class="room-card__size" *ngIf="product.specifications?.Size">
				{{ product.specifications?.Size }}
			</span>
		</div>
		<h3 class="room-card__title">{{ product.title }}</h3>
		<p class="room-card__description">{{ product.description }}</p>
		<ul class="room-card__details">
			<li *ngFor="let item of highlights">{{ item }}</li>
		</ul>
		<div class="room-card__footer">
			<div>
				<span class="room-card__price">From UAH {{ product.price }}</span>
				<span class="room-card__note">per night</span>
			</div>
			<div class="contact-links contact-links--compact">
				<span class="contact-links__label">Contact via socials</span>
				<div class="contact-links__items">
					<a
						class="contact-links__item"
						href="https://hotel-kp.com.ua/"
						target="_blank"
						rel="noopener noreferrer"
						aria-label="Website"
					>
						<i class="bi bi-globe2"></i>
						<span>Website</span>
					</a>
					<a
						class="contact-links__item"
						href="https://www.instagram.com/bilya_richku/"
						target="_blank"
						rel="noopener noreferrer"
						aria-label="Instagram"
					>
						<i class="bi bi-instagram"></i>
						<span>Instagram</span>
					</a>
					<a
						class="contact-links__item"
						href="https://www.facebook.com/bilyarichki/"
						target="_blank"
						rel="noopener noreferrer"
						aria-label="Facebook"
					>
						<i class="bi bi-facebook"></i>
						<span>Facebook</span>
					</a>
					<a
						class="contact-links__item"
						href="https://www.booking.com/hotel/ua/bilya-richky.html"
						target="_blank"
						rel="noopener noreferrer"
						aria-label="Booking.com listing"
					>
						<i class="bi bi-building"></i>
						<span>Booking.com</span>
					</a>
				</div>
			</div>
		</div>
	</div>
</article>
