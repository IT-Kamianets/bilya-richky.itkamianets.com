<header class="header">
	<div class="header__container">
		<a class="header__logo" routerLink="/">
			<svg width="30" height="30" viewBox="0 0 118 94" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<path fill-rule="evenodd" clip-rule="evenodd" d="M24.509 0c-6.733 0-11.715 5.893-11.492 12.284.214 6.14-.064 14.092-2.066 20.577C8.943 39.365 5.547 43.485 0 44.014v5.972c5.547.529 8.943 4.649 10.951 11.153 2.002 6.485 2.28 14.437 2.066 20.577C12.794 88.106 17.776 94 24.51 94H93.5c6.733 0 11.714-5.893 11.491-12.284-.214-6.14.064-14.092 2.066-20.577 2.009-6.504 5.396-10.624 10.943-11.153v-5.972c-5.547-.529-8.934-4.649-10.943-11.153-2.002-6.484-2.28-14.437-2.066-20.577C105.214 5.894 100.233 0 93.5 0H24.508zM80 57.863C80 66.663 73.436 72 62.543 72H44a2 2 0 01-2-2V24a2 2 0 012-2h18.437c9.083 0 15.044 4.92 15.044 12.474 0 5.302-4.01 10.049-9.119 10.88v.277C75.317 46.394 80 51.21 80 57.863zM60.521 28.34H49.948v14.934h8.905c6.884 0 10.68-2.772 10.68-7.727 0-4.643-3.264-7.207-9.012-7.207zM49.948 49.2v16.458H60.91c7.167 0 10.964-2.876 10.964-8.281 0-5.406-3.903-8.178-11.425-8.178H49.948z"/>
			</svg>
			<span class="header__logo-text">Bilya Richky</span>
			<span class="header__logo-subtitle">Riverside Hotel</span>
		</a>

		<nav class="header__nav" [class.header__nav--open]="isMenuOpen">
			<a
				class="header__nav-link"
				routerLink="/"
				routerLinkActive="header__nav-link--active"
				[routerLinkActiveOptions]="{ exact: true }"
				(click)="closeMenu()"
			>
				{{ 'nav.home' | t }}
			</a>
			<a
				class="header__nav-link"
				routerLink="/rooms"
				routerLinkActive="header__nav-link--active"
				(click)="closeMenu()"
			>
				{{ 'nav.rooms' | t }}
			</a>
			<a
				class="header__nav-link"
				routerLink="/amenities"
				routerLinkActive="header__nav-link--active"
				(click)="closeMenu()"
			>
				{{ 'nav.amenities' | t }}
			</a>
			<a
				class="header__nav-link"
				routerLink="/location"
				routerLinkActive="header__nav-link--active"
				(click)="closeMenu()"
			>
				{{ 'nav.location' | t }}
			</a>
			<a
				class="header__nav-link"
				routerLink="/gallery"
				routerLinkActive="header__nav-link--active"
				(click)="closeMenu()"
			>
				{{ 'nav.gallery' | t }}
			</a>
		</nav>

		<div class="header__actions" (keydown.escape)="closeSocialMenu()">
			<div class="lang-toggle" role="group" aria-label="Language">
				<button
					type="button"
					class="lang-option"
					[class.active]="language.currentLanguage() === 'ua'"
					[attr.aria-pressed]="language.currentLanguage() === 'ua'"
					(click)="setLanguage('ua')"
				>
					UA
				</button>
				<button
					type="button"
					class="lang-option"
					[class.active]="language.currentLanguage() === 'en'"
					[attr.aria-pressed]="language.currentLanguage() === 'en'"
					(click)="setLanguage('en')"
				>
					EN
				</button>
			</div>

			<div class="header__socials" aria-label="Contact via socials">
				<a
					class="header__social-link"
					href="https://hotel-kp.com.ua/"
					aria-label="Website"
					target="_blank"
					rel="noopener noreferrer"
				>
					<i class="bi bi-globe2"></i>
				</a>
				<a
					class="header__social-link"
					href="https://www.instagram.com/bilya_richku/"
					aria-label="Instagram"
					target="_blank"
					rel="noopener noreferrer"
				>
					<i class="bi bi-instagram"></i>
				</a>
				<a
					class="header__social-link"
					href="https://www.facebook.com/bilyarichki/"
					aria-label="Facebook"
					target="_blank"
					rel="noopener noreferrer"
				>
					<i class="bi bi-facebook"></i>
				</a>
				<a
					class="header__social-link"
					href="https://www.booking.com/hotel/ua/bilya-richky.html"
					aria-label="Booking.com listing"
					target="_blank"
					rel="noopener noreferrer"
				>
					<i class="bi bi-building"></i>
				</a>
				<a
					class="header__social-link"
					href="https://www.google.com.ua/travel/hotels/entity/ChcI-bnfjZqOv-8ZGgsvZy8xdGg1NXJwMBAB"
					aria-label="Google Hotels listing"
					target="_blank"
					rel="noopener noreferrer"
				>
					<i class="bi bi-google"></i>
				</a>
				<a
					class="header__social-link"
					href="https://pokupon.ua/uk/deals/item/791494-vid-1-nochi-vidpochinku-z-harchuvannyam-u-goteli-bilya-richki-u-kam-yantsi-podilskomu-u-budni-dni"
					aria-label="Pokupon listing"
					target="_blank"
					rel="noopener noreferrer"
				>
					<i class="bi bi-ticket-perforated"></i>
				</a>
				<a
					class="header__social-link"
					href="https://superdeal.ua/uk/places/item/61669"
					aria-label="Superdeal listing"
					target="_blank"
					rel="noopener noreferrer"
				>
					<i class="bi bi-percent"></i>
				</a>
			</div>

			<div class="header__socials-menu">
				<button
					class="header__socials-toggle"
					type="button"
					(click)="toggleSocialMenu()"
					[attr.aria-expanded]="isSocialMenuOpen"
					aria-haspopup="true"
					aria-controls="social-menu"
					aria-label="Open social links"
				>
					<i class="bi bi-link-45deg"></i>
				</button>
				<div
					id="social-menu"
					class="header__socials-popover"
					[class.is-open]="isSocialMenuOpen"
					role="menu"
				>
					<a
						class="header__socials-item"
						href="https://hotel-kp.com.ua/"
						aria-label="Website"
						target="_blank"
						rel="noopener noreferrer"
					>
						<i class="bi bi-globe2"></i>
						<span>Website</span>
					</a>
					<a
						class="header__socials-item"
						href="https://www.instagram.com/bilya_richku/"
						aria-label="Instagram"
						target="_blank"
						rel="noopener noreferrer"
					>
						<i class="bi bi-instagram"></i>
						<span>Instagram</span>
					</a>
					<a
						class="header__socials-item"
						href="https://www.facebook.com/bilyarichki/"
						aria-label="Facebook"
						target="_blank"
						rel="noopener noreferrer"
					>
						<i class="bi bi-facebook"></i>
						<span>Facebook</span>
					</a>
					<a
						class="header__socials-item"
						href="https://www.booking.com/hotel/ua/bilya-richky.html"
						aria-label="Booking.com listing"
						target="_blank"
						rel="noopener noreferrer"
					>
						<i class="bi bi-building"></i>
						<span>Booking.com</span>
					</a>
					<a
						class="header__socials-item"
						href="https://www.google.com.ua/travel/hotels/entity/ChcI-bnfjZqOv-8ZGgsvZy8xdGg1NXJwMBAB"
						aria-label="Google Hotels listing"
						target="_blank"
						rel="noopener noreferrer"
					>
						<i class="bi bi-google"></i>
						<span>Google Hotels</span>
					</a>
					<a
						class="header__socials-item"
						href="https://pokupon.ua/uk/deals/item/791494-vid-1-nochi-vidpochinku-z-harchuvannyam-u-goteli-bilya-richky-u-kam-yantsi-podilskomu-u-budni-dni"
						aria-label="Pokupon listing"
						target="_blank"
						rel="noopener noreferrer"
					>
						<i class="bi bi-ticket-perforated"></i>
						<span>Pokupon</span>
					</a>
					<a
						class="header__socials-item"
						href="https://superdeal.ua/uk/places/item/61669"
						aria-label="Superdeal listing"
						target="_blank"
						rel="noopener noreferrer"
					>
						<i class="bi bi-percent"></i>
						<span>Superdeal</span>
					</a>
				</div>
			</div>
		</div>

		<button
			class="header__hamburger"
			type="button"
			(click)="toggleMenu()"
			[attr.aria-expanded]="isMenuOpen"
			aria-label="Open menu"
		>
			<span class="header__hamburger-line"></span>
			<span class="header__hamburger-line"></span>
			<span class="header__hamburger-line"></span>
		</button>
	</div>

</header>
